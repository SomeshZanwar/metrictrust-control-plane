version: 2

sources: []

models:
  - name: stg_experiment_events
    description: "Cleaned experiment assignment + activation events."
    columns:
      - name: user_id
        tests: [not_null]
      - name: variant
        tests:
          - not_null
          - accepted_values:
              values: ['control', 'treatment']

  - name: fct_experiment_outcomes
    description: "Activation rate per experiment variant. Consumed by the MetricTrust evidence broker."
    columns:
      - name: experiment_id
        tests: [not_null]
      - name: variant
        tests: [not_null]
      - name: activation_rate
        tests: [not_null]
